apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 2
  selector:
    matchLabels:
      service: n8n
  template:
    metadata:
      labels:
        service: n8n
    spec:
      initContainers:
        - name: init-permissions
          image: busybox:latest
          command: ['sh', '-c', 'chown -R 1000:1000 /data']
          volumeMounts:
            - name: n8n-data
              mountPath: /data
      containers:
        - image: docker.n8n.io/n8nio/n8n
          name: n8n
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 500Mi
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: __SUBDOMAIN__.__DOMAIN_NAME__
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "https"
            - name: NODE_ENV
              value: "production"
            - name: WEBHOOK_URL
              value: https://__SUBDOMAIN__.__DOMAIN_NAME__/
            - name: GENERIC_TIMEZONE
              value: __TIMEZONE__
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres-service.n8n.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
