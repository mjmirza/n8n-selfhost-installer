apiVersion: v1
kind: Service
metadata:
  labels:
    service: n8n
  name: n8n-service
  namespace: n8n
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 5678
      protocol: TCP
    - name: https
      port: 443
      targetPort: 5678
      protocol: TCP
  selector:
    service: n8n
