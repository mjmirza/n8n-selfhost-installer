apiVersion: v1
kind: Secret
metadata:
  namespace: n8n
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: __POSTGRES_USER__
  POSTGRES_PASSWORD: __POSTGRES_PASSWORD__
  POSTGRES_DB: n8n
  POSTGRES_NON_ROOT_USER: __POSTGRES_NON_ROOT_USER__
  POSTGRES_NON_ROOT_PASSWORD: __POSTGRES_NON_ROOT_PASSWORD__
