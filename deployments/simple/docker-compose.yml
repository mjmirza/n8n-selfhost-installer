version: "3.7"

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - __DATA_FOLDER__/caddy_config:/config
      - __DATA_FOLDER__/caddy_config/Caddyfile:/etc/caddy/Caddyfile

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=__SUBDOMAIN__.__DOMAIN_NAME__
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://__SUBDOMAIN__.__DOMAIN_NAME__/
      - GENERIC_TIMEZONE=__TIMEZONE__
    volumes:
      - n8n_data:/home/node/.n8n
      - __DATA_FOLDER__/local_files:/files

volumes:
  caddy_data:
    external: true
  n8n_data:
    external: true
