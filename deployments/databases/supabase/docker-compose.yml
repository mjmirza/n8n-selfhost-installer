version: '3.8'

# Standalone Supabase Deployment
# Complete self-hosted Firebase alternative with PostgreSQL, Auth, Storage, Vector DB

volumes:
  supabase_db_data:
  supabase_storage_data:

networks:
  supabase-network:
    driver: bridge

services:
  # Supabase PostgreSQL Database (with pgvector for AI/RAG)
  supabase-db:
    image: supabase/postgres:15.6.1.120
    container_name: supabase-db
    restart: unless-stopped
    networks:
      - supabase-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: __SUPABASE_DB_PASSWORD__
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      # pgvector extension enabled by default
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./init-supabase-db.sh:/docker-entrypoint-initdb.d/init-supabase-db.sh
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5

  # Supabase Studio (Admin Dashboard)
  supabase-studio:
    image: supabase/studio:20240101-8e3a1a6
    container_name: supabase-studio
    restart: unless-stopped
    networks:
      - supabase-network
    ports:
      - "8000:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: __SUPABASE_DB_PASSWORD__

      DEFAULT_ORGANIZATION: __ORGANIZATION_NAME__
      DEFAULT_PROJECT: __PROJECT_NAME__

      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: https://supabase.__DOMAIN_NAME__
      SUPABASE_ANON_KEY: __SUPABASE_ANON_KEY__
      SUPABASE_SERVICE_KEY: __SUPABASE_SERVICE_KEY__
    depends_on:
      supabase-db:
        condition: service_healthy

  # Kong API Gateway (Routes all Supabase services)
  supabase-kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: unless-stopped
    networks:
      - supabase-network
    ports:
      - "8001:8000"    # HTTP
      - "8443:8443"    # HTTPS
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,rate-limiting
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro

  # GoTrue (Authentication Service)
  supabase-auth:
    image: supabase/gotrue:v2.151.0
    container_name: supabase-auth
    restart: unless-stopped
    networks:
      - supabase-network
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://supabase.__DOMAIN_NAME__

      # Database
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:__SUPABASE_DB_PASSWORD__@supabase-db:5432/postgres

      # Site settings
      GOTRUE_SITE_URL: https://supabase.__DOMAIN_NAME__
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"

      # JWT settings
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: __JWT_SECRET__

      # Email settings
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: __SMTP_HOST__
      GOTRUE_SMTP_PORT: __SMTP_PORT__
      GOTRUE_SMTP_USER: __SMTP_USER__
      GOTRUE_SMTP_PASS: __SMTP_PASSWORD__
      GOTRUE_SMTP_ADMIN_EMAIL: __ADMIN_EMAIL__
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify

      # OAuth providers (optional)
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "false"
    depends_on:
      supabase-db:
        condition: service_healthy

  # PostgREST (Auto-generated REST API)
  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    container_name: supabase-rest
    restart: unless-stopped
    networks:
      - supabase-network
    environment:
      PGRST_DB_URI: postgres://authenticator:__SUPABASE_DB_PASSWORD__@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: __JWT_SECRET__
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: __JWT_SECRET__
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy

  # Realtime (WebSocket Server for live updates)
  supabase-realtime:
    image: supabase/realtime:v2.28.32
    container_name: supabase-realtime
    restart: unless-stopped
    networks:
      - supabase-network
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: __SUPABASE_DB_PASSWORD__
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: __JWT_SECRET__
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: __SECRET_KEY_BASE__
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      supabase-db:
        condition: service_healthy

  # Storage API (S3-compatible object storage)
  supabase-storage:
    image: supabase/storage-api:v1.0.6
    container_name: supabase-storage
    restart: unless-stopped
    networks:
      - supabase-network
    environment:
      ANON_KEY: __SUPABASE_ANON_KEY__
      SERVICE_KEY: __SUPABASE_SERVICE_KEY__
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: __JWT_SECRET__
      DATABASE_URL: postgres://supabase_storage_admin:__SUPABASE_DB_PASSWORD__@supabase-db:5432/postgres

      # Storage backend
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 52428800

      # S3 settings (if using S3 instead of file)
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - supabase_storage_data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started

  # Postgres Meta (Database management API)
  supabase-meta:
    image: supabase/postgres-meta:v0.80.0
    container_name: supabase-meta
    restart: unless-stopped
    networks:
      - supabase-network
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: __SUPABASE_DB_PASSWORD__
    depends_on:
      supabase-db:
        condition: service_healthy

  # Imgproxy (Image transformation service - optional)
  supabase-imgproxy:
    image: darthsim/imgproxy:latest
    container_name: supabase-imgproxy
    restart: unless-stopped
    networks:
      - supabase-network
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /var/lib/storage
      IMGPROXY_USE_ETAG: "true"
    volumes:
      - supabase_storage_data:/var/lib/storage:ro
