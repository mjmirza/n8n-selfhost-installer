_format_version: "2.1"

###############################################################################
# Kong API Gateway Configuration for Supabase
# Routes all Supabase services through a single endpoint
###############################################################################

services:
  # PostgREST (Database REST API)
  - name: rest-v1
    url: http://supabase-rest:3000
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Language
            - Content-Type
            - Authorization
            - X-Client-Info
            - apikey
          exposed_headers:
            - X-Total-Count
            - Content-Range
          credentials: true
          max_age: 3600

  # GoTrue (Authentication API)
  - name: auth-v1
    url: http://supabase-auth:9999
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Language
            - Content-Type
            - Authorization
            - X-Client-Info
            - apikey
          credentials: true
          max_age: 3600

  # Realtime (WebSocket API)
  - name: realtime-v1
    url: http://supabase-realtime:4000/socket/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Language
            - Content-Type
            - Authorization
            - X-Client-Info
            - apikey
          credentials: true
          max_age: 3600

  # Storage API
  - name: storage-v1
    url: http://supabase-storage:5000
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Language
            - Content-Language
            - Content-Type
            - Authorization
            - X-Client-Info
            - apikey
            - Content-Range
            - Range
          credentials: true
          max_age: 3600

  # Postgres Meta (Database management)
  - name: meta
    url: http://supabase-meta:8080
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/

###############################################################################
# Global Plugins
###############################################################################

