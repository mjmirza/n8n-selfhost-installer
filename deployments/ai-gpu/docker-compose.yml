version: '3.8'

volumes:
  caddy_data:
    external: true
  n8n_data:
    external: true
  postgres_data:
  ollama_data:
  supabase_db_data:

networks:
  n8n-network:
    driver: bridge

services:
  # Caddy Reverse Proxy with SSL
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    networks:
      - n8n-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - __DATA_FOLDER__/caddy_config:/config
      - __DATA_FOLDER__/caddy_config/Caddyfile:/etc/caddy/Caddyfile

  # PostgreSQL Database for N8N
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    networks:
      - n8n-network
    environment:
      - POSTGRES_USER=__POSTGRES_USER__
      - POSTGRES_PASSWORD=__POSTGRES_PASSWORD__
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - __DATA_FOLDER__/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U __POSTGRES_USER__ -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  # N8N Workflow Automation
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    networks:
      - n8n-network
    environment:
      - N8N_HOST=__SUBDOMAIN__.__DOMAIN_NAME__
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://__SUBDOMAIN__.__DOMAIN_NAME__/
      - GENERIC_TIMEZONE=__TIMEZONE__

      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=__POSTGRES_NON_ROOT_USER__
      - DB_POSTGRESDB_PASSWORD=__POSTGRES_NON_ROOT_PASSWORD__

      # Ollama Integration
      - OLLAMA_HOST=http://ollama:11434

      # Supabase Integration
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_KEY=__SUPABASE_ANON_KEY__
    volumes:
      - n8n_data:/home/node/.n8n
      - __DATA_FOLDER__/local_files:/files
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      supabase-kong:
        condition: service_started

  # Ollama - Local LLM with GPU Acceleration
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - n8n-network
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Supabase PostgreSQL Database
  supabase-db:
    image: supabase/postgres:15.6.1.120
    container_name: supabase-db
    restart: unless-stopped
    networks:
      - n8n-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: __SUPABASE_DB_PASSWORD__
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

  # Supabase Studio (Admin UI)
  supabase-studio:
    image: supabase/studio:20240101-8e3a1a6
    container_name: supabase-studio
    restart: unless-stopped
    networks:
      - n8n-network
    ports:
      - "8000:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: __SUPABASE_DB_PASSWORD__
      DEFAULT_ORGANIZATION: NEXT8N
      DEFAULT_PROJECT: N8N AI Project
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: https://supabase.__DOMAIN_NAME__
      SUPABASE_ANON_KEY: __SUPABASE_ANON_KEY__
      SUPABASE_SERVICE_KEY: __SUPABASE_SERVICE_KEY__

  # Supabase Kong API Gateway
  supabase-kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: unless-stopped
    networks:
      - n8n-network
    ports:
      - "8001:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,rate-limiting
    volumes:
      - __DATA_FOLDER__/supabase/kong.yml:/var/lib/kong/kong.yml:ro

  # Supabase GoTrue (Authentication)
  supabase-auth:
    image: supabase/gotrue:v2.151.0
    container_name: supabase-auth
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://supabase.__DOMAIN_NAME__

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:__SUPABASE_DB_PASSWORD__@supabase-db:5432/postgres

      GOTRUE_SITE_URL: https://supabase.__DOMAIN_NAME__
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: __JWT_SECRET__

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
    depends_on:
      supabase-db:
        condition: service_healthy

  # Supabase PostgREST (REST API)
  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    container_name: supabase-rest
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      PGRST_DB_URI: postgres://authenticator:__SUPABASE_DB_PASSWORD__@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: __JWT_SECRET__
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: __JWT_SECRET__
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy

  # Supabase Realtime
  supabase-realtime:
    image: supabase/realtime:v2.28.32
    container_name: supabase-realtime
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: __SUPABASE_DB_PASSWORD__
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: __JWT_SECRET__
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: __SECRET_KEY_BASE__
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      supabase-db:
        condition: service_healthy

  # Supabase Storage
  supabase-storage:
    image: supabase/storage-api:v1.0.6
    container_name: supabase-storage
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      ANON_KEY: __SUPABASE_ANON_KEY__
      SERVICE_KEY: __SUPABASE_SERVICE_KEY__
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: __JWT_SECRET__
      DATABASE_URL: postgres://supabase_storage_admin:__SUPABASE_DB_PASSWORD__@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - __DATA_FOLDER__/supabase/storage:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started

  # Supabase Meta
  supabase-meta:
    image: supabase/postgres-meta:v0.80.0
    container_name: supabase-meta
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: __SUPABASE_DB_PASSWORD__
    depends_on:
      supabase-db:
        condition: service_healthy
